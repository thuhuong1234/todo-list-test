name: Deploy Frontend

on:
  push:
    paths:
      - "frontend/**"
    branches:
      - feature/todo-app

jobs:
  build-and-deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Build Frontend
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend-app ./frontend

      - name: Push Frontend
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker push ${{ secrets.DOCKER_USERNAME }}/frontend-app:latest

      - name: Deploy Frontend to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            docker stop frontend-app || true && docker rm frontend-app || true
            docker pull ${{ secrets.DOCKER_USERNAME }}/frontend-app
            docker run -d -p 80:80 --name frontend-app ${{ secrets.DOCKER_USERNAME }}/frontend-app
